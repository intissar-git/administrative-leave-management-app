    <style>

            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);

                    <a href="calendarRH.html" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-3 py-2 text-sm font-medium rounded-md">

                    <a href="historiqueRh.html" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-3 py-2 text-sm font-medium rounded-md">
                        <i class="fas fa-history text-gray-500 group-hover:text-gray-600 mr-3"></i>

                    </a>
                    <a href="mon_profile.html" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-3 py-2 text-sm font-medium rounded-md">

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div>
                <h1 class="text-2xl font-semibold text-gray-900">Détails de l'employé</h1>
                <nav class="flex mt-2" aria-label="Breadcrumb">
                    <ol class="flex items-center space-x-4">
                        <li>
                            <div>
                                <a href="rh-dash.html" class="text-gray-400 hover:text-gray-500">
                                    <svg class="flex-shrink-0 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />

                        <li>
                            <div class="flex items-center">
                                <svg class="flex-shrink-0 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">

                                <svg class="flex-shrink-0 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />

            <div class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Colonne gauche - Informations personnelles et professionnelles -->
                <div class="col-span-1 lg:col-span-2 space-y-6">
                    <!-- Carte Informations Personnelles -->
                    <div class="info-card p-6">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                            <i class="fas fa-user text-blue-500 mr-2"></i> Informations Personnelles
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="personalInfo">

                        </div>
                    </div>

                    <!-- Carte Informations Professionnelles -->
                    <div class="info-card p-6">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                            <i class="fas fa-briefcase text-blue-500 mr-2"></i> Informations Professionnelles
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="professionalInfo">
                            <!-- Les données seront chargées dynamiquement ici -->
                        </div>
                    </div>
                </div>

                <!-- Colonne droite - Solde de congé -->
                <div class="col-span-1">
                    <!-- Carte Solde de Congé -->
                    <div class="solde-card p-6">

                            <i class="fas fa-calendar-alt mr-2"></i> Solde de Congé

<!-- Toast notification -->
<div id="toast" class="fixed top-4 right-4 hidden">
    <div class="bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>
</div>

<script>
    // Récupération du username depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username');
    const token = localStorage.getItem('token');
    let currentUserData = {};

    // Redirige si le username ou le token sont manquants
    if (!username || !token) {
        window.location.href = 'employes.html';
    }

    // Fonction pour formater les dates en français
    const formatDate = (dateString) => {
        if (!dateString) return 'Non renseigné';
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('fr-FR', options);
    };

    // Fonction pour formater le rôle
    function formatRole(role) {
        const roles = {
            'ADMIN': 'Administrateur',
            'RH': 'Ressources Humaines',
            'CHEF_DEPARTEMENT': 'Chef de Département',
            'CHEF_SERVICE': 'Chef de Service',
            'EMPLOYEE': 'Employé'
        };
        return roles[role] || role;
    }

    // Afficher une notification toast
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        toastMessage.textContent = message;

        if (isError) {
            toast.firstElementChild.classList.remove('bg-green-500');
            toast.firstElementChild.classList.add('bg-red-500');
        } else {
            toast.firstElementChild.classList.remove('bg-red-500');
            toast.firstElementChild.classList.add('bg-green-500');
        }

        toast.classList.remove('hidden');
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // Charger les données de l'employé
    async function loadUserData() {
        try {
            // Requête pour les données de base de l'utilisateur
            const userResponse = await fetch(`http://localhost:8080/api/users/${username}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!userResponse.ok) {
                throw new Error('Utilisateur non trouvé');
            }
            currentUserData = await userResponse.json();

            // Requête pour le solde de congé de l'utilisateur
            const soldeResponse = await fetch(`http://localhost:8080/api/solde-conge/employe/${username}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!soldeResponse.ok) {
                throw new Error('Solde non disponible');
            }
            const soldeData = await soldeResponse.json();

            // Afficher les données
            displayUserInfo(currentUserData);
            displaySoldeInfo(soldeData);

        } catch (error) {
            console.error("Erreur de chargement des données :", error);
            showToast('Erreur: ' + error.message, true);
            setTimeout(() => {
                window.location.href = 'employes.html';
            }, 2000);
        }
    }

    // Afficher les informations personnelles et professionnelles
    function displayUserInfo(user) {
        // Informations personnelles
        document.getElementById('personalInfo').innerHTML = `
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Numéro PPR</label>
                <p class="text-gray-900">${user.matricule || 'Non renseigné'}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Nom complet</label>
                <p class="text-gray-900">${user.lastName} ${user.firstName}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Email</label>
                <p class="text-gray-900">${user.email}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Date de naissance</label>
                <p class="text-gray-900">${formatDate(user.dateNaissance)}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Adresse</label>
                <p class="text-gray-900">${user.adresse || 'Non renseigné'}</p>
            </div>
        `;

        // Informations professionnelles
        document.getElementById('professionalInfo').innerHTML = `
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Département</label>
                <p class="text-gray-900">${user.departement?.nomDepartement || 'Non assigné'}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Service</label>
                <p class="text-gray-900">${user.serviceName || 'Non assigné'}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Grade</label>
                <p class="text-gray-900">${user.grade || 'Non renseigné'}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Échelle</label>
                <p class="text-gray-900">${user.echelle || 'N/A'}</p>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium text-gray-500">Rôle</label>
                <p class="text-gray-900">${formatRole(user.role)}</p>
            </div>
        `;
    }

    // Afficher les informations de solde de congé
    function displaySoldeInfo(solde) {
        document.getElementById('soldeInfo').innerHTML = `
            <div class="flex justify-between items-center p-4 bg-white/10 rounded-lg">
                <div>
                    <p class="text-sm">Solde global</p>
                    <p class="text-3xl font-bold">${solde.soldeGlobal}</p>
                </div>
                <i class="fas fa-coins text-3xl opacity-75"></i>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="bg-white/10 p-4 rounded-lg text-center">
                    <p class="text-sm mb-1">Année en cours</p>
                    <p class="text-xl font-semibold">${solde.soldeAnneeCourante}</p>
                    <p class="text-xs opacity-75 mt-1">${solde.annee}</p>
                </div>

                <div class="bg-white/10 p-4 rounded-lg text-center">
                    <p class="text-sm mb-1">Report année précédente</p>
                    <p class="text-xl font-semibold">${solde.soldeAnneePrecedente}</p>
                </div>
            </div>
        `;
    }

    // Initialisation de la page
    document.addEventListener('DOMContentLoaded', async function() {
        // Récupération des infos utilisateur connecté
        try {
            const response = await fetch('http://localhost:8080/api/users/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error('Erreur de chargement des infos utilisateur');

            const user = await response.json();
            document.getElementById('headerRole').textContent = formatRole(user.role);

        } catch (error) {
            console.error('Erreur:', error);
            // Redirige vers la page de login si le token est invalide
            window.location.href = '../user/index.html';
        }

        // Gestion du menu utilisateur
        const userMenuButton = document.getElementById('userMenuBtn');
        const userMenu = document.getElementById('userMenu');

        if (userMenuButton && userMenu) {
            userMenuButton.addEventListener('click', () => {
                const expanded = userMenuButton.getAttribute('aria-expanded') === 'true';
                userMenuButton.setAttribute('aria-expanded', !expanded);
                userMenu.classList.toggle('hidden');
            });

            // Ferme le menu lorsque l'on clique en dehors
            document.addEventListener('click', (event) => {
                if (!userMenuButton.contains(event.target) && !userMenu.contains(event.target)) {
                    userMenuButton.setAttribute('aria-expanded', 'false');
                    userMenu.classList.add('hidden');
                }
            });
        }

        // Gestion de la déconnexion
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('refresh_token');
            window.location.href = '../user/index.html';
        });

        // Charger les données de l'employé
        loadUserData();
    });
</script>
</body>
